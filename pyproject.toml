[project]
name = "ragforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mehmood", email = "mehmood.ismail1222@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "chromadb>=1.5.9",
    "fastapi>=0.165.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

#[project.scripts]


[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring external services",
]