services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /home/appuser/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./alembic:/app/alembic
      - ./src:/app/src
      - ./logs:/app/logs
      - uploads_data:/app/uploads
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.0.20
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped


  tests:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - test
    env_file:
      - test.env.example
    environment:
      RAGFORGE_ENV_FILE: test.env.example
      HF_HOME: /home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    volumes:
      - ./tests:/app/tests:ro
      - ./test.env.example:/app/test.env.example:ro
      - huggingface_cache:/home/appuser/.cache/huggingface
    command: >
      sh -c "uv sync --locked --group dev &&
             uv run --no-sync alembic upgrade head &&
             uv run --no-sync pytest -v"


  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - ragforge.workers.ingestion_worker
    env_file:
      - .env
    environment:
      HF_HOME: /home/appuser/.cache/huggingface
    volumes:
      - ./alembic:/app/alembic
      - ./src:/app/src
      - ./logs:/app/logs
      - uploads_data:/app/uploads
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s

  evals:
    build: .
    profiles: ["eval"]
    env_file:
      - .env
    environment:
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
      HF_HOME: /home/appuser/.cache/huggingface
      EVAL_DOCUMENT_ID: ${EVAL_DOCUMENT_ID:-}
    volumes:
      - ./evals:/app/evals
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    command: ["uv", "run", "--no-sync", "python", "evals/run_evaluation.py"]

volumes:
  uploads_data:
  huggingface_cache:
  postgres_data:
  chroma_data: