services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HF_HOME: /home/appuser/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./alembic:/app/alembic
      - ./src:/app/src
      - uploads_data:/app/uploads
      - huggingface_cache:/home/appuser/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:1.0.20
    volumes:
      - chroma_data:/data
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
      ANONYMIZED_TELEMETRY: "FALSE"
    restart: unless-stopped

  tests:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - test.env
    environment:
      RAGFORGE_ENV_FILE: test.env
      HF_HOME: /home/appuser/.cache/huggingface
    profiles:
      - test
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    volumes:
      - ./tests:/app/tests:ro
      - ./pyproject.toml:/app/pyproject.toml:ro
      - ./uv.lock:/app/uv.lock:ro
      - ./test.env:/app/test.env:ro
      - huggingface_cache:/home/appuser/.cache/huggingface
    command: >
      sh -c "uv sync --locked &&
             uv run --no-sync alembic upgrade head &&
             uv run --no-sync pytest -v"

volumes:
  uploads_data:
  huggingface_cache:
  postgres_data:
  chroma_data: