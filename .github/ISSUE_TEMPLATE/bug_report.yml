name: Bug report
description: Report a reproducible problem in RAGForge
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Do not include secrets or private documents. Report vulnerabilities privately as described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and sanitized logs
      description: OS, Docker/Python versions and relevant error output.
